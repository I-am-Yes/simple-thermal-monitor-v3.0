<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Thermal Monitor preview</title>
    <link rel="stylesheet" href="../src/styles.css" />
    <style>
      html,
      body {
        width: 560px;
        height: 390px;
        overflow: hidden;
      }
      .settings-panel {
        display: none;
      }
    </style>
  </head>
  <body class="app-focused">
    <header class="titlebar">
      <span class="titlebar-title">Thermal Monitor</span>
      <div class="window-controls">
        <button class="win-btn pin" type="button" aria-label="Pin on top">
          <svg viewBox="0 0 12 12" aria-hidden="true">
            <path d="M7.7 1.5l2.8 2.8-1.15 1.15-.85-.3-2.45 4.25-.95-.95 2.45-4.25-.3-.85L7.7 1.5z" />
            <path d="M5.15 8.45L3.2 10.7" />
          </svg>
        </button>
        <button class="win-btn" type="button" aria-label="Minimize">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 6h10" /></svg>
        </button>
        <button class="win-btn" type="button" aria-label="Maximize">
          <svg viewBox="0 0 12 12" aria-hidden="true">
            <rect x="1.5" y="1.5" width="9" height="9" rx="0.5" />
          </svg>
        </button>
        <button class="win-btn close" type="button" aria-label="Close">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2L2 10" /></svg>
        </button>
      </div>
    </header>

    <main class="monitor">
      <section class="board">
        <div class="cards">
          <article class="card" style="--heat: rgb(135, 255, 0)">
            <div class="card-stack">
              <span class="card-label">CPU Package</span>
              <div class="card-temp">
                <span class="num">41.2</span>
                <span class="deg">°C</span>
              </div>
            </div>
          </article>
          <article class="card" style="--heat: rgb(119, 255, 0)">
            <div class="card-stack">
              <span class="card-label">P-Core 0</span>
              <div class="card-temp">
                <span class="num">38.6</span>
                <span class="deg">°C</span>
              </div>
            </div>
          </article>
          <article class="card" style="--heat: rgb(185, 255, 0)">
            <div class="card-stack">
              <span class="card-label">GPU</span>
              <div class="card-temp">
                <span class="num">49.0</span>
                <span class="deg">°C</span>
              </div>
            </div>
          </article>
          <article class="card" style="--heat: rgb(166, 255, 0)">
            <div class="card-stack">
              <span class="card-label">SSD</span>
              <div class="card-temp">
                <span class="num">46.0</span>
                <span class="deg">°C</span>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>

    <button class="settings-btn" type="button" aria-label="Open settings">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.52a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.6.22l2.39-.96c.5.39 1.04.7 1.63.94l.36 2.54c.04.24.25.42.49.42h3.8c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.55 1.63.94l2.39.96c.23.12.52.02.6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
        />
      </svg>
    </button>
  </body>
</html>
