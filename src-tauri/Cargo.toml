[package]
name = "simple-thermal-monitor"
version = "3.0.0"
description = "Simple Thermal Monitor"
authors = ["Simple Thermal Monitor"]
edition = "2021"

[lib]
name = "simple_thermal_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
nvml-wrapper = "0.11"
wmi = "0.15"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
